
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b10">
<title>Stax — Share your world</title>
<link rel="icon" href="stax.png" sizes="16x16" type="image/png" />  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: dark;
  --bg:#080b10;
  --panel:#101722;
  --line:#253246;
  --text:#f4f7fb;
  --muted:#8b9bb0;
  --blue:#3984ff;
}
* { box-sizing:border-box }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px system-ui,sans-serif;
}
button,input,textarea { font:inherit }
button { cursor:pointer }
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:2px solid var(--blue);
  outline-offset:2px;
}
.app {
  width:min(1100px,100%);
  min-height:100vh;
  margin:auto;
  display:grid;
  grid-template-columns:220px minmax(0,600px) 240px;
}
.sidebar,.rightbar { padding:20px 14px; position:sticky; top:0; height:100vh; overflow:hidden; align-self:start; }
.sidebar { border-right:1px solid var(--line);display:flex;flex-direction:column; }
.rightbar { border-left:1px solid var(--line) }
.logo { font-size:30px;font-weight:850;letter-spacing:-1px }
.logo span { color:var(--blue) }
.nav {
  display:block;width:100%;text-align:left;
  padding:13px;margin-top:8px;border:0;
  border-radius:12px;background:transparent;color:var(--text)
}
.nav:hover,.nav.active { background:#18263a }
.sidebar-account { margin-top:auto; padding:14px 8px 4px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; min-width:0; }
.sidebar-account-avatar { width:42px;height:42px;border-radius:50%;background:#1d3760;color:#b9d5ff;display:grid;place-items:center;font-weight:800;flex:0 0 42px;overflow:hidden; }
.sidebar-account-avatar img { width:100%;height:100%;object-fit:cover;display:block; }
.sidebar-account-info { min-width:0;flex:1;line-height:1.45; }
.sidebar-account-name { display:block;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.sidebar-account-id { display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.main { min-width:0 }
.top {
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  font-size:20px;font-weight:750;
}
.panel { padding:18px 20px;border-bottom:1px solid var(--line) }
textarea,input {
  width:100%;background:#0b111a;color:var(--text);
  border:1px solid var(--line);border-radius:12px;
  padding:12px;
}
textarea { min-height:100px;resize:vertical }
.row { display:flex;gap:10px;align-items:center }
.row.between { justify-content:space-between }
.btn {
  background:var(--blue);color:white;border:0;
  border-radius:999px;padding:10px 17px;font-weight:700;
}
.btn.secondary { background:#18263a }
.post { padding:18px 20px;border-bottom:1px solid var(--line);position:relative }
.post-head { display:flex;gap:10px;align-items:center;margin-bottom:10px }
.avatar {
  width:42px;height:42px;border-radius:50%;
  background:#1d3760;display:grid;place-items:center;
  font-weight:800;color:#b9d5ff;flex-shrink:0;
}
.muted { color:var(--muted);font-size:13px }
.post-text { white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65 }
.hashtag-link { display:inline;padding:0;border:0;background:transparent;color:#68a5ff;font:inherit;font-weight:650;cursor:pointer; }
.hashtag-link:hover { text-decoration:underline;color:#9bc4ff }
.hashtag-hint { margin-top:7px;color:var(--muted);font-size:12px }
.hashtag-cloud { display:flex;gap:8px;flex-wrap:wrap }
.actions { display:flex;justify-content:space-between;gap:8px;margin-top:14px }
.post-menu-wrap{position:relative;margin-left:auto}.post-menu-trigger{font-size:22px;line-height:1;padding:5px 9px}.post-menu{position:absolute;right:0;top:34px;z-index:12;min-width:160px;padding:6px;background:#111c2b;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0008}.post-menu button{display:block;width:100%;text-align:left;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--text)}.post-menu button:hover{background:#20314a}.post-pinned{font-size:12px;color:#80b4ff;margin:0 0 8px}
.action { background:transparent;border:0;color:var(--muted);padding:6px }
.action:hover { color:var(--blue) }
.post-count { color:var(--muted);font-size:12px;margin-left:4px }
.reply-list { margin:12px 0 0 10px;padding-left:12px;border-left:2px solid var(--line) }
.reply-item { padding:9px 0;border-bottom:1px solid var(--line) }
.reply-item:last-child { border-bottom:0 }
.reply-author { font-weight:700;font-size:13px }
.reply-content { white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;line-height:1.5 }
.reply-composer { display:flex;gap:8px;margin-top:10px }
.reply-composer input { min-width:0;flex:1 }
.searchbox { margin-bottom:12px }
.notice { color:var(--muted);font-size:13px;line-height:1.7 }
#status { margin-top:10px;font-size:13px;color:#a9caff }
.auth { max-width:420px;margin:8vh auto;padding:22px }
.auth h1 { font-size:36px;margin-bottom:4px }
.auth input { margin:7px 0 }
.hidden { display:none!important }

/* Responsive desktop / mobile navigation */
.mobilebar { display:none; }
.drawer-backdrop { display:none; }
.sidebar-brand { display:flex;align-items:center;gap:10px;margin:0 8px 24px; }
.sidebar-brand img { width:38px;height:38px;object-fit:cover;border-radius:12px; }
.sidebar-brand .logo { font-size:27px; }
@media(max-width:1000px) {
  .app { grid-template-columns:190px minmax(0,1fr); width:100%; }
  .sidebar { padding:18px 10px; }
  .rightbar { display:none; }
}
@media(max-width:640px) {
  body { font-size:14px; }
  .app { display:block;width:100%;min-height:100dvh;padding:58px 0 0; }
  .mobilebar {
    position:fixed;display:flex;align-items:center;gap:12px;
    top:0;left:0;right:0;height:58px;padding:7px 13px;
    z-index:20;background:rgba(8,11,16,.96);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .mobile-logo-button { display:flex;align-items:center;gap:9px;min-width:0;
    border:0;background:transparent;color:var(--text);padding:0;text-align:left; }
  .mobile-logo-button img { width:40px;height:40px;object-fit:cover;border-radius:11px;display:block; }
  .mobile-wordmark { font-weight:850;font-size:21px;letter-spacing:-.7px; }
  .mobile-wordmark span { color:var(--blue); }
  .mobile-current-page { margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .sidebar {
    display:block;position:fixed;z-index:31;top:0;bottom:0;left:0;
    width:min(82vw,300px);height:100dvh;overflow:hidden;overscroll-behavior:none;
    padding:18px 14px calc(24px + env(safe-area-inset-bottom));
    background:#0b111b;border-right:1px solid var(--line);
    box-shadow:18px 0 50px rgba(0,0,0,.38);
    transform:translateX(-110%);transition:transform .22s ease;
  }
  .sidebar.open { transform:translateX(0); }
  .sidebar-brand { margin:4px 8px 24px; }
  .sidebar-brand img { width:44px;height:44px;border-radius:13px; }
  .sidebar-brand .logo { display:block;text-align:left;font-size:29px; }
  .nav { display:block;width:100%;text-align:left;font-size:15px;padding:13px 14px;margin-top:7px;border-radius:12px; }
  .drawer-backdrop.show { display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.58);backdrop-filter:blur(2px); }
  .main { width:100%;min-width:0; }
  .top { position:sticky;top:58px;z-index:8;padding:13px 16px;font-size:18px;background:rgba(8,11,16,.96);backdrop-filter:blur(12px); }
  .panel,.post { padding:14px 13px; }
  .row { gap:8px; }
  .avatar { width:38px;height:38px; }
  textarea { min-height:82px; }
  .actions { flex-wrap:wrap; }
  .btn { padding:10px 14px; }
  .auth { margin:3vh auto;padding:18px; }
}
@media(prefers-reduced-motion:reduce) {
  .sidebar { transition:none; }
}
.image-tools{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.image-pick{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;color:#b9d5ff;cursor:pointer;background:#111c2b}
.image-pick input{display:none}
.image-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.image-preview-item{position:relative;width:84px;height:84px}
.image-preview-item img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.image-preview-item button{position:absolute;right:-6px;top:-6px;border:0;border-radius:50%;width:24px;height:24px;background:#d83d54;color:white}
.post-media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.post-media img{width:100%;max-height:420px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
@media(max-width:600px){.post-media img{max-height:300px}}

/* In-app dialogs: replace native alert/confirm/prompt UI */
.ui-modal-backdrop{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.68);backdrop-filter:blur(7px)}
.ui-modal-backdrop.open{display:flex}
.ui-modal{width:min(440px,100%);background:#101722;border:1px solid #30415a;border-radius:18px;padding:20px;box-shadow:0 24px 80px #000a;animation:modal-in .16s ease-out}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.ui-modal h2{font-size:19px;margin:0 0 8px}
.ui-modal p{margin:0 0 14px;color:#a8b7ca;line-height:1.6;white-space:pre-line}
.ui-modal select,.ui-modal textarea,.ui-modal input{width:100%;background:#0b111a;color:#f4f7fb;border:1px solid #30415a;border-radius:11px;padding:11px;font:inherit;margin:5px 0 12px}
.ui-modal textarea{min-height:100px;resize:vertical}
.ui-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}
.ui-modal-actions button{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.ui-modal-cancel{background:#202d40;color:#e8eef8}
.ui-modal-ok{background:#3984ff;color:white}
.ui-modal-ok.danger{background:#d94359}
@media(prefers-reduced-motion:reduce){.ui-modal{animation:none}}


  .repost-attribution{display:flex;align-items:center;gap:7px;color:var(--muted,#8b98a8);font-size:13px;font-weight:600;margin:0 0 8px 34px}
  .repost-attribution .repost-icon{font-size:15px;color:#00ba7c}
  .original-post-label{font-size:12px;color:var(--muted,#8b98a8);margin:0 0 7px 34px;padding:5px 9px;border-left:2px solid #3984ff;background:rgba(57,132,255,.06);border-radius:0 7px 7px 0}
</style>
</head>
<body>

<section id="auth" class="auth">
  <h1 class="logo">Stax<span>.</span></h1>
  <p class="muted">Share your world.</p>
  <div class="panel" style="padding:16px 0;border:0">
    <h2 id="authTitle">ログイン</h2>
    <input id="displayName" placeholder="表示名（新規登録時）" maxlength="40" class="hidden">
    <input id="userId" placeholder="Stax ID" autocomplete="username" maxlength="20">
    <input id="password" placeholder="パスワード" type="password" autocomplete="current-password">
    <button class="btn" id="authButton" style="width:100%;margin-top:10px">ログイン</button>
    <button class="nav" id="switchAuth">アカウントを新規登録</button>
    <div id="authStatus" role="status"></div>
  </div>
</section>

<div id="app" class="app hidden">
  <div class="mobilebar">
    <button type="button" id="mobileMenuButton" class="mobile-logo-button" aria-label="メニューを開く" aria-expanded="false" aria-controls="sidebar">
      <img src="stax.png" alt="Stax" onerror="this.style.display='none'">
      <span class="mobile-wordmark">Stax<span>.</span></span>
    </button>
    <span class="mobile-current-page" id="mobileCurrentPage">ホーム</span>
  </div>
  <div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar" aria-label="メインメニュー">
    <div class="sidebar-brand">
      <img src="stax.png" alt="Stax" onerror="this.style.display='none'">
      <div class="logo">Stax<span>.</span></div>
    </div>
    <button class="nav active" data-page="home">⌂ ホーム</button>
    <button class="nav" data-page="search">⌕ 検索</button>
    <button class="nav" data-page="notifications">♧ 通知</button>
    <button class="nav" data-page="messages">✉ DM</button>
    <button class="nav" data-page="profile">◉ プロフィール</button>
    <button class="nav" data-page="settings">⚙ 設定</button>
    <button class="nav hidden" data-page="reports" id="adminReportsNav">⚑ 通報管理</button>
    <button class="nav" id="accountSwitch">⇄ アカウント切替</button>
    <button class="nav" id="logout">↪ ログアウト</button>
    <div class="sidebar-account" id="sidebarAccount" aria-label="ログイン中のアカウント">
      <div class="sidebar-account-avatar" id="sidebarAccountAvatar">S</div>
      <div class="sidebar-account-info">
        <span class="sidebar-account-name" id="sidebarAccountName">ログイン中</span>
        <span class="sidebar-account-id" id="sidebarAccountId">@-</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="top" id="pageTitle">ホーム</div>
    <section id="composer" class="panel">
      <div class="row">
        <div class="avatar" id="myAvatar">S</div>
        <div style="flex:1">
          <textarea id="postText" maxlength="2000" placeholder="いま、スターしてる？"></textarea>
          <div class="hashtag-hint">#話題 のように入力すると、投稿後にクリックできるハッシュタグになります。</div>
        </div>
      </div>
      <div class="image-tools">
        <label class="image-pick">▧ 画像を添付
          <input id="postImages" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
        </label>
        <span class="muted" id="imageCount">最大4枚・各2MBまで</span>
      </div>
      <div id="imagePreview" class="image-preview"></div>
      <div class="row between" style="margin-top:10px">
        <span class="muted" id="charCount">0 / 2000</span>
        <button class="btn" id="publish">投稿する</button>
      </div>
    </section>
    <section id="content" aria-live="polite">
      <div class="panel muted">タイムラインを読み込む準備ができました。</div>
    </section>
  </main>

  <aside class="rightbar">
    <input id="searchInput" class="searchbox" placeholder="ユーザー・投稿を検索">
    <div class="panel" style="border:1px solid var(--line);border-radius:14px">
      <strong>Staxへようこそ</strong>
      <p class="notice">あなたの世界を共有しよう。気になる投稿を見つけて、新しいつながりを作ろう。</p>
    </div>
    <p class="notice">Stax · Share your world</p>
  </aside>
</div>


<div id="uiModalBackdrop" class="ui-modal-backdrop" role="presentation">
  <section class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="uiModalTitle" aria-describedby="uiModalMessage">
    <h2 id="uiModalTitle">確認</h2>
    <p id="uiModalMessage"></p>
    <div id="uiModalField"></div>
    <div class="ui-modal-actions">
      <button type="button" class="ui-modal-cancel" id="uiModalCancel">キャンセル</button>
      <button type="button" class="ui-modal-ok" id="uiModalOk">決定</button>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // Supabase Dashboard → Project Settings → API
  const SUPABASE_URL = "https://epecjthitwtgmkhdgsyn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rqF7CtvvtRqNXxlEO7SQcA_HEtbJD6B";

  const configured =
    !SUPABASE_URL.includes("YOUR_PROJECT") &&
    !SUPABASE_KEY.includes("YOUR_SUPABASE");

  const $ = id => document.getElementById(id);
  let client = null;
  let registering = false;
  let currentUser = null;
  let page = "home";
  let viewedProfileId = null;
  let profileSubpanel = null;
  let profileSubpanelElement = null;
  let activeConversationId = null;

  if (configured && window.supabase) {
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  function status(message, target = "authStatus") {
    $(target).textContent = message;
  }

  let modalResolver = null;
  function closeUiModal(value = null) {
    $("uiModalBackdrop").classList.remove("open");
    document.body.style.overflow = "";
    const resolve = modalResolver;
    modalResolver = null;
    if (resolve) resolve(value);
  }
  function openUiModal({title="確認", message="", field=null, confirmText="決定", danger=false, cancelText="キャンセル"} = {}) {
    return new Promise(resolve => {
      modalResolver = resolve;
      $("uiModalTitle").textContent = title;
      $("uiModalMessage").textContent = message;
      $("uiModalCancel").textContent = cancelText;
      $("uiModalOk").textContent = confirmText;
      $("uiModalOk").classList.toggle("danger", danger);
      const holder = $("uiModalField");
      holder.replaceChildren();
      let control = null;
      if (field) {
        control = document.createElement(field.type === "select" ? "select" : field.type === "textarea" ? "textarea" : "input");
        if (field.type !== "select" && field.type !== "textarea") control.type = field.type || "text";
        if (field.placeholder) control.placeholder = field.placeholder;
        if (field.value !== undefined) control.value = field.value;
        if (field.maxLength) control.maxLength = field.maxLength;
        if (field.rows && field.type === "textarea") control.rows = field.rows;
        if (field.type === "select") {
          (field.options || []).forEach((option, index) => {
            const node = document.createElement("option");
            node.value = String(index);
            node.textContent = option.label;
            control.append(node);
          });
        }
        holder.append(control);
      }
      $("uiModalBackdrop").classList.add("open");
      document.body.style.overflow = "hidden";
      $("uiModalCancel").onclick = () => closeUiModal(null);
      $("uiModalOk").onclick = () => closeUiModal(control ? control.value : true);
      $("uiModalBackdrop").onclick = event => { if (event.target === $("uiModalBackdrop")) closeUiModal(null); };
      $("uiModalOk").disabled = false;
      requestAnimationFrame(() => control ? control.focus() : $("uiModalOk").focus());
    });
  }
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && $("uiModalBackdrop")?.classList.contains("open")) closeUiModal(null);
    if (event.key === "Enter" && $("uiModalBackdrop")?.classList.contains("open") && event.target.tagName !== "TEXTAREA") {
      event.preventDefault();
      $("uiModalOk").click();
    }
  });

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;",
      '"':"&quot;", "'":"&#39;"
    })[char]);
  }

  function closeMobileMenu() {
    const sidebar = $("sidebar");
    const backdrop = $("drawerBackdrop");
    const button = $("mobileMenuButton");
    if (sidebar) sidebar.classList.remove("open");
    if (backdrop) backdrop.classList.remove("show");
    if (button) button.setAttribute("aria-expanded", "false");
    document.body.style.overflow = "";
  }

  function openMobileMenu() {
    const sidebar = $("sidebar");
    const backdrop = $("drawerBackdrop");
    const button = $("mobileMenuButton");
    if (sidebar) sidebar.classList.add("open");
    if (backdrop) backdrop.classList.add("show");
    if (button) button.setAttribute("aria-expanded", "true");
    document.body.style.overflow = "hidden";
  }

  $("mobileMenuButton").addEventListener("click", () => {
    if ($("sidebar").classList.contains("open")) closeMobileMenu();
    else openMobileMenu();
  });
  $("drawerBackdrop").addEventListener("click", closeMobileMenu);
  document.addEventListener("keydown", event => { if (event.key === "Escape") closeMobileMenu(); });

  function updateSidebarAccount(user = currentUser) {
    if (!user) return;
    const avatar = $("sidebarAccountAvatar");
    avatar.replaceChildren();
    if (user.avatar_url) {
      const img = document.createElement("img");
      img.src = user.avatar_url;
      img.alt = "";
      img.onerror = () => { avatar.textContent = (user.display_name || user.user_id || "S").slice(0,1).toUpperCase(); };
      avatar.appendChild(img);
    } else {
      avatar.textContent = (user.display_name || user.user_id || "S").slice(0,1).toUpperCase();
    }
    $("sidebarAccountName").textContent = user.display_name || user.user_id || "ユーザー";
    $("sidebarAccountId").textContent = "@" + (user.user_id || "-");
    $("myAvatar").replaceChildren();
    if (user.avatar_url) {
      const img = document.createElement("img"); img.src = user.avatar_url; img.alt = "";
      img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:50%";
      $("myAvatar").appendChild(img);
    } else {
      $("myAvatar").textContent = (user.display_name || user.user_id || "S").slice(0,1).toUpperCase();
    }
  }

  function showApp(user) {
    currentUser = user;
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    updateSidebarAccount(user);
    $("adminReportsNav").classList.toggle("hidden", user.is_admin !== true);
    loadPage();
  }

  $("switchAuth").addEventListener("click", () => {
    registering = !registering;
    $("authTitle").textContent = registering ? "新規登録" : "ログイン";
    $("authButton").textContent = registering ? "登録する" : "ログイン";
    $("displayName").classList.toggle("hidden", !registering);
    $("switchAuth").textContent =
      registering ? "ログインに戻る" : "アカウントを新規登録";
    $("password").autocomplete =
      registering ? "new-password" : "current-password";
    status("");
  });

  async function authRequest(action, data) {
    const response = await fetch(
      SUPABASE_URL + "/functions/v1/stax-auth",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY
        },
        body:JSON.stringify({action,...data})
      }
    );
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(result.error || result.message || "認証に失敗しました。");
    }
    return result;
  }

  $("authButton").addEventListener("click", async () => {
    if (!configured || !client) {
      status("先にSUPABASE_URLとSUPABASE_KEYを設定してください。");
      return;
    }

    const user_id = $("userId").value.trim();
    const password = $("password").value;
    const display_name = $("displayName").value.trim();

    if (!/^[A-Za-z0-9_]{3,20}$/.test(user_id)) {
      status("IDは英数字と_を使った3〜20文字にしてください。");
      return;
    }
    if (password.length < 8) {
      status("パスワードは8文字以上にしてください。");
      return;
    }
    if (registering && !display_name) {
      status("表示名を入力してください。");
      return;
    }

    $("authButton").disabled = true;
    status("処理中…");

    try {
      const result = await authRequest(
        registering ? "register" : "login",
        {user_id,password,display_name}
      );

      if (!result.token) {
        throw new Error("認証APIの応答にtokenがありません。");
      }

      // 本番ではHttpOnly Cookieを使う構成がより安全です。
      // localStorageへの長期保存はXSSの影響を受ける可能性があります。
      sessionStorage.setItem("stax_token", result.token);
      // ログイン応答にプロフィール画像が含まれない場合があるため、
      // stax-api の me から avatar_url を含む最新プロフィールを取得する。
      let user = result.user || { user_id, display_name:display_name || user_id };
      try {
        const profile = await api("me");
        user = profile.user || profile || user;
      } catch (profileError) {
        console.warn("プロフィール情報の取得に失敗しました:", profileError);
      }
      rememberAccount(user, result.token);
      showApp(user);
    } catch (error) {
      status(error.message || "接続に失敗しました。");
    } finally {
      $("authButton").disabled = false;
    }
  });

  function rememberAccount(user, token) {
    const key = user.user_id || user.id || "unknown";
    let list = [];
    try { list = JSON.parse(sessionStorage.getItem("stax_saved_accounts") || "[]"); } catch {}
    list = list.filter(x => x.key !== key);
    list.unshift({ key, user_id:user.user_id || key, display_name:user.display_name || user.user_id || key, token });
    sessionStorage.setItem("stax_saved_accounts", JSON.stringify(list.slice(0, 10)));
  }

  async function api(action, data = {}) {
    const token = sessionStorage.getItem("stax_token");
    if (!token) throw new Error("ログインしてください。");

    const response = await fetch(
      SUPABASE_URL + "/functions/v1/stax-api",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify({action,...data})
      }
    );
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(result.error || result.message || "APIエラー");
    }
    return result;
  }

  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          let quality = 0.82;
          let data = canvas.toDataURL("image/webp", quality);
          while (data.length > 900_000 && quality > 0.45) {
            quality -= 0.08;
            data = canvas.toDataURL("image/webp", quality);
          }
          if (data.length > 900_000) return reject(new Error("画像を圧縮できませんでした。別の画像を選んでください。"));
          resolve(data);
        };
        img.onerror = () => reject(new Error("画像を読み込めませんでした。"));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error("画像を読み込めませんでした。"));
      reader.readAsDataURL(file);
    });
  }

  function renderHashtagText(container, value) {
    const text = String(value || "");
    const pattern = /#([\p{L}\p{N}_]{1,50})/gu;
    let lastIndex = 0;
    for (const match of text.matchAll(pattern)) {
      const index = match.index ?? 0;
      container.append(document.createTextNode(text.slice(lastIndex, index)));
      const button = document.createElement("button");
      button.type = "button";
      button.className = "hashtag-link";
      button.textContent = match[0];
      button.addEventListener("click", () => {
        $("searchInput").value = match[0];
        page = "search";
        document.querySelectorAll("[data-page]").forEach(item => item.classList.toggle("active", item.dataset.page === "search"));
        loadPage();
      });
      container.append(button);
      lastIndex = index + match[0].length;
    }
    container.append(document.createTextNode(text.slice(lastIndex)));
  }

        const file = panel.querySelector('#settingsAvatar').files[0];
        if (file) {
          if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error('PNG/JPEG/WebP/GIF画像を選択してください。');
          if (file.size > 2 * 1024 * 1024) throw new Error('画像は2MB以下にしてください。');
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('画像を読み込めませんでした。')); reader.readAsDataURL(file);
          });
          const uploaded = await api('upload_avatar', {data_url:dataUrl});
          if (uploaded.user) currentUser = uploaded.user;
        }
        const saved = await api('update_profile', {
          display_name:panel.querySelector('#settingsDisplayName').value.trim(),
          bio:panel.querySelector('#settingsBio').value,
          website:panel.querySelector('#settingsWebsite').value.trim(),
          is_private:panel.querySelector('#settingsPrivate').checked
        });
        currentUser = saved.user || currentUser;
        updateSidebarAccount(currentUser);
        rememberAccount(currentUser, sessionStorage.getItem('stax_token'));
        const myAvatarEl = $("myAvatar");
        myAvatarEl.replaceChildren();
        if (currentUser.avatar_url) {
          const img = document.createElement('img'); img.src = currentUser.avatar_url; img.alt = '';
          img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%'; myAvatarEl.appendChild(img);
        } else {
          myAvatarEl.textContent = (currentUser.display_name || currentUser.user_id || 'S').slice(0,1).toUpperCase();
        }
        message.textContent = '設定を保存しました。';
      } catch (error) { message.textContent = error.message || '保存できませんでした。'; }
      finally { button.disabled = false; }
    });
  }

  async function renderProfile(result) {
    const root = $("content"); root.replaceChildren();
    profileSubpanel = null; profileSubpanelElement = null;
    const user = result.user;
    const panel = document.createElement("div"); panel.className = "panel profile-main-panel";
    panel.innerHTML = '<div class="row">' + avatarMarkup(user) + '<div style="flex:1"><h2 style="margin:0">' +
      escapeHTML(user.display_name || user.user_id) + (user.is_private ? ' 🔒 鍵アカウント' : '') +
      '</h2><div class="muted">@' + escapeHTML(user.user_id) + '</div></div></div>' +
      (user.bio ? '<p>' + escapeHTML(user.bio) + '</p>' : '') +
      (user.website ? '<p><a href="' + escapeHTML(user.website) + '" target="_blank" rel="noopener noreferrer">' + escapeHTML(user.website) + '</a></p>' : '') +
      '<div class="row" style="margin:12px 0;flex-wrap:wrap"><button class="action" data-list="followers"><strong>' +
      Number(result.followers_count || 0) + '</strong> フォロワー</button><button class="action" data-list="following"><strong>' +
      Number(result.following_count || 0) + '</strong> フォロー中</button></div>';
    if (!result.is_me) {
      panel.innerHTML += '<div class="row" style="flex-wrap:wrap"><button class="btn" id="profileFollow">' +
        (result.following_by_me ? 'フォロー中（解除）' : result.requested_by_me ? '申請中（取り消しは再操作）' : 'フォロー') +
        '</button>' + (result.followed_by_me && result.following_by_me ? '<button class="btn secondary" id="profileDM">DMを送る</button>' : '') + '</div>';
    } else {
      panel.innerHTML += '<div class="row" style="flex-wrap:wrap"><button class="btn secondary" id="showFollowRequests">フォロー申請を確認</button></div>';
    }
    root.appendChild(panel);
    panel.querySelectorAll('[data-list]').forEach(button => button.addEventListener('click', async () => {
      const key = 'list-' + button.dataset.list;
      if (profileSubpanel === key) { toggleProfileSubpanel(key, document.createElement('div')); return; }
      try {
        const r = await api('follow_list', {account_id:user.id,kind:button.dataset.list});
        const list = document.createElement('div'); list.className='panel';
        list.innerHTML='<strong>' + (button.dataset.list === 'followers' ? 'フォロワー' : 'フォロー中') + '</strong>';
        if (!r.accounts.length) list.innerHTML += '<p class="muted">まだユーザーがいません。</p>';
        r.accounts.forEach(a => list.appendChild(accountCard(a)));
        toggleProfileSubpanel(key, list);
      } catch(error) { status(error.message, 'content'); }
    }));
    if (!result.is_me) {
      const follow = panel.querySelector('#profileFollow');
      if (follow) follow.addEventListener('click', async () => {
        try { const r=await api('follow',{account_id:user.id}); status(r.requested?'フォロー申請を送信しました。':r.canceled_request?'フォロー申請を取り消しました。':r.following?'フォローしました。':'フォローを解除しました。','content'); await loadPage(); }
        catch(error) { status(error.message,'content'); }
      });
      const dm = panel.querySelector('#profileDM');
      if (dm) dm.addEventListener('click', async () => {
        try { const created = await api('create_dm',{account_id:user.id}); activeConversationId = created.conversation && created.conversation.id; page='messages'; await loadPage(); }
        catch(error) { status(error.message,'content'); }
      });
    } else {
      panel.querySelector('#showFollowRequests').addEventListener('click', async () => {
        const key = 'requests';
        if (profileSubpanel === key) { toggleProfileSubpanel(key, document.createElement('div')); return; }
        try {
          const r = await api('follow_requests');
          const box = document.createElement('div'); box.className='panel'; box.innerHTML='<strong>フォロー申請</strong>';
          if (!r.requests.length) box.innerHTML += '<p class="muted">申請はありません。</p>';
          for (const req of r.requests) {
            const row=document.createElement('div'); row.className='post';
            row.innerHTML='<strong>' + escapeHTML(req.requester.display_name || req.requester.user_id) + '</strong> <span class="muted">@' + escapeHTML(req.requester.user_id) + '</span> <button class="btn" data-accept>承認</button> <button class="btn secondary" data-reject>拒否</button>';
            row.querySelector('[data-accept]').addEventListener('click', async()=>{ try { await api('accept_follow_request',{request_id:req.id}); profileSubpanel=null; profileSubpanelElement=null; await loadPage(); } catch(e){status(e.message,'content');} });
            row.querySelector('[data-reject]').addEventListener('click', async()=>{ try { await api('reject_follow_request',{request_id:req.id}); profileSubpanel=null; profileSubpanelElement=null; await loadPage(); } catch(e){status(e.message,'content');} });
            box.appendChild(row);
          }
          toggleProfileSubpanel(key, box);
        } catch(error) { status(error.message,'content'); }
      });;
    }
    if (result.private_locked) {
      const locked=document.createElement('div'); locked.className='panel muted'; locked.textContent='このアカウントは鍵アカウントです。フォローが承認されると投稿を見られます。'; root.appendChild(locked); return;
    }
    const posts=result.posts || [];
    if (!posts.length) { const empty=document.createElement('div'); empty.className='panel muted'; empty.textContent='まだ投稿がありません。'; root.appendChild(empty); }
    posts.forEach(post => root.appendChild(postCard(post)));
  }

  async function renderMessages(result) {
    const root = $("content"); root.replaceChildren();
    const conversations = result.conversations || [];
    const wrap = document.createElement('div'); wrap.className = 'panel';
    wrap.innerHTML = '<h2 style="margin-top:0">DM</h2>' +
      '<div class="panel" style="margin:0 0 14px;padding:12px">' +
      '<strong>DMを送れる相手</strong><p class="muted" style="margin:6px 0 10px">相互フォロー中で、ブロック関係のないユーザーを一覧表示します。</p>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap"><input id="dmSearchInput" type="search" placeholder="一覧を絞り込み：ID・表示名" style="flex:1;min-width:180px">' +
      '<button class="btn secondary" id="dmSearchButton">一覧を更新</button></div><div id="dmSearchResults" style="margin-top:10px"><p class="muted">一覧を読み込み中…</p></div></div>' +
      '<div class="muted" style="margin:8px 0">会話一覧には相手の表示名、メッセージには送信者名が表示されます。</div><div id="dmConversationList"></div><div id="dmThread" style="margin-top:16px"></div>';
    root.appendChild(wrap);
    const list = wrap.querySelector('#dmConversationList');
    const searchInput = wrap.querySelector('#dmSearchInput');
    const searchButton = wrap.querySelector('#dmSearchButton');
    const searchResults = wrap.querySelector('#dmSearchResults');
    let dmCandidates = [];
    function drawDmCandidates() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const accounts = dmCandidates.filter(a =>
        !query ||
        String(a.user_id || '').toLocaleLowerCase().includes(query) ||
        String(a.display_name || '').toLocaleLowerCase().includes(query)
      );
      searchResults.replaceChildren();
      if (!accounts.length) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = dmCandidates.length
          ? '検索条件に一致する相手はいません。'
          : 'DMを送れる相手はいません。相手もあなたをフォローすると、ここに表示されます。';
        searchResults.appendChild(empty);
        return;
      }
      accounts.forEach(account => {
        const row = document.createElement('div');
        row.className = 'row between';
        row.style.cssText = 'padding:9px 0;border-bottom:1px solid var(--line);gap:8px';
        const info = document.createElement('div');
        info.style.flex = '1';
        info.innerHTML = '<strong>' + escapeHTML(account.display_name || account.user_id) + '</strong><div class="muted">@' + escapeHTML(account.user_id || '') + '</div>';
        const start = document.createElement('button');
        start.className = 'btn';
        start.textContent = 'DMを開始';
        start.addEventListener('click', async () => {
          start.disabled = true;
          start.textContent = '開始中…';
          try {
            const created = await api('create_dm', {account_id:account.id});
            activeConversationId = created.conversation && created.conversation.id;
            await loadPage();
          } catch (error) {
            const message = document.createElement('p');
            message.className = 'muted';
            message.textContent = error.message || 'DMを開始できませんでした。';
            searchResults.prepend(message);
            start.disabled = false;
            start.textContent = 'DMを開始';
          }
        });
        row.append(info, start);
        searchResults.appendChild(row);
      });
    }
    async function loadDmCandidates() {
      searchButton.disabled = true;
      searchResults.replaceChildren();
      try {
        const found = await api('dm_candidates');
        dmCandidates = found.accounts || [];
        drawDmCandidates();
      } catch (error) {
        searchResults.textContent = 'DM可能な相手を取得できませんでした：' + (error.message || 'APIエラー');
      } finally {
        searchButton.disabled = false;
      }
    }
    searchButton.addEventListener('click', loadDmCandidates);
    searchInput.addEventListener('input', drawDmCandidates);
    loadDmCandidates();
    if (!conversations.length) {
      list.innerHTML = '<p class="muted">DMはまだありません。上の検索から相互フォロー中の相手を選んでDMを開始してください。</p>';
      return;
    }
    conversations.forEach(c => {
      const b = document.createElement('button'); b.className = 'btn secondary';
      b.style.cssText = 'margin:4px 6px 4px 0';
      b.textContent = c.display_title || c.title || (c.conversation_type === 'direct' ? 'ユーザー不明' : 'グループ');
      if (c.id === activeConversationId) b.style.background = '#245bb3';
      b.addEventListener('click', () => { activeConversationId = c.id; renderMessages(result); });
      list.appendChild(b);
    });
    const thread = wrap.querySelector('#dmThread');
    const selected = conversations.find(c => c.id === activeConversationId) || conversations[0];
    if (!activeConversationId || !conversations.some(c => c.id === activeConversationId)) activeConversationId = selected.id;
    thread.innerHTML = '<div class="muted" style="margin-bottom:10px">メッセージ</div><div id="dmMessages" style="max-height:48vh;overflow:auto"></div><textarea id="dmText" maxlength="10000" placeholder="メッセージを入力" style="min-height:75px;margin-top:12px"></textarea><div class="row between" style="margin-top:8px"><span id="dmStatus" class="muted"></span><button class="btn" id="dmSend">送信</button></div>';
    const messageBox = thread.querySelector('#dmMessages');
    try {
      const data = await api('get_messages', {conversation_id:activeConversationId});
      (data.messages || []).forEach(m => {
        const bubble = document.createElement('div'); bubble.className = 'post';
        bubble.style.cssText = 'padding:10px 0;border-bottom:1px solid var(--line)';
        bubble.innerHTML = '<div class="post-text"></div><div class="muted"></div>';
        bubble.querySelector('.post-text').textContent = m.content || (m.attachment_url ? '添付ファイル: ' + m.attachment_url : '');
        const senderLabel = m.sender_id === (currentUser && currentUser.id)
          ? '自分'
          : ((m.sender_display_name || m.sender_user_id || '不明なユーザー') + (m.sender_user_id ? ' (@' + m.sender_user_id + ')' : ''));
        bubble.querySelector('.muted').textContent = senderLabel + ' · ' + new Date(m.created_at).toLocaleString();
        messageBox.appendChild(bubble);
      });
      if (!(data.messages || []).length) messageBox.innerHTML = '<p class="muted">最初のメッセージを送ってみましょう。</p>';
      messageBox.scrollTop = messageBox.scrollHeight;
    } catch (error) { messageBox.textContent = error.message || 'メッセージを読み込めませんでした。'; }
    thread.querySelector('#dmSend').addEventListener('click', async () => {
      const input = thread.querySelector('#dmText'); const text = input.value.trim();
      if (!text) { thread.querySelector('#dmStatus').textContent = 'メッセージを入力してください。'; return; }
      const button = thread.querySelector('#dmSend'); button.disabled = true;
      thread.querySelector('#dmStatus').textContent = '送信中…';
      try { await api('send_message', {conversation_id:activeConversationId, text}); input.value = ''; await loadPage(); }
      catch (error) { thread.querySelector('#dmStatus').textContent = error.message || '送信できませんでした。'; }
      finally { button.disabled = false; }
    });
  }

  function renderAdminReports(result) {
    const root = $("content"); root.replaceChildren();
    const reports = Array.isArray(result.reports) ? result.reports : [];
    const heading = document.createElement("div"); heading.className = "panel";
    heading.innerHTML = '<div class="row between"><strong>報告されたポスト</strong><button class="btn secondary" id="refreshReports">更新</button></div><p class="muted" style="margin:8px 0 0">通報内容と投稿者を確認し、必要に応じて対象ポストを削除できます。</p>';
    root.appendChild(heading);
    heading.querySelector("#refreshReports").addEventListener("click", loadPage);
    if (!reports.length) {
      const empty = document.createElement("div"); empty.className = "panel muted"; empty.textContent = "報告されたポストはありません。"; root.appendChild(empty); return;
    }
    reports.forEach(report => {
      const card = document.createElement("article"); card.className = "post";
      const reporter = (report.reporter_display_name || report.reporter_user_id || "不明") + (report.reporter_user_id ? " (@" + report.reporter_user_id + ")" : "");
      const author = (report.post_author_display_name || report.reported_display_name || report.post_author_user_id || report.reported_user_id || "不明") + ((report.post_author_user_id || report.reported_user_id) ? " (@" + (report.post_author_user_id || report.reported_user_id) + ")" : "");
      const postMissing = !report.reported_post_id || report.post_is_deleted === true;
      const top = document.createElement("div"); top.className = "row between";
      const date = document.createElement("span"); date.className = "muted"; date.textContent = report.report_created_at ? new Date(report.report_created_at).toLocaleString() : (report.created_at ? new Date(report.created_at).toLocaleString() : "日時不明");
      const statusLabel = document.createElement("span"); statusLabel.className = "muted"; statusLabel.textContent = postMissing ? "投稿は削除済み" : (report.status || "未対応");
      top.append(date, statusLabel); card.appendChild(top);
      const info = document.createElement("div"); info.style.cssText = "margin-top:10px;line-height:1.7";
      const reporterLine = document.createElement("div"); reporterLine.textContent = "報告者: " + reporter;
      const authorLine = document.createElement("div"); authorLine.textContent = "投稿アカウント: " + author;
      const idLine = document.createElement("div"); idLine.className = "muted"; idLine.textContent = "ポストID: " + (report.reported_post_id || "なし");
      const reasonLine = document.createElement("div"); reasonLine.textContent = "報告理由: " + (report.reason || "未入力");
      const details = document.createElement("div"); details.className = "muted"; details.style.whiteSpace = "pre-wrap"; details.textContent = report.details || "";
      info.append(reporterLine, authorLine, idLine, reasonLine); if (report.details) info.appendChild(details); card.appendChild(info);
      const body = document.createElement("div"); body.className = "post-text"; body.style.cssText = "margin-top:12px;padding:12px;background:#0b111a;border:1px solid var(--line);border-radius:12px";
      body.textContent = report.post_content || (postMissing ? "このポストは削除済み、または見つかりません。" : "ポスト本文を取得できません。"); card.appendChild(body);
      const actions = document.createElement("div"); actions.className = "actions";
      if (!postMissing) {
        const del = document.createElement("button"); del.className = "btn"; del.textContent = "このポストを削除";
        del.addEventListener("click", async () => {
          const confirmed = await openUiModal({title:"報告されたポストを削除",message:"このポストを削除しますか？タイムラインなどから表示されなくなります。",confirmText:"ポストを削除",danger:true});
          if (!confirmed) return;
          del.disabled = true;
          try { await api("admin_delete_reported_post", {post_id:report.reported_post_id}); await loadPage(); }
          catch (error) { status(error.message || "削除できませんでした。", "content"); del.disabled = false; }
        });
        actions.appendChild(del);
      }
      card.appendChild(actions); root.appendChild(card);
    });
  }

  function renderResult(result) {
    if (page === "messages") { renderMessages(result); return; }
    if (page === "profile") { renderProfile(result); return; }
    if (page === "settings") { renderSettings(result); return; }
    if (page === "reports") { renderAdminReports(result); return; }
    const root = $("content"); root.replaceChildren();
    if (page === "search") {
      const accounts = result.accounts || [];
      const accountHeading = document.createElement('div'); accountHeading.className='panel'; accountHeading.innerHTML='<strong>ユーザー</strong>';
      root.appendChild(accountHeading);
      if (!accounts.length) { const empty=document.createElement('div'); empty.className='panel muted'; empty.textContent='一致するユーザーはいません。'; root.appendChild(empty); }
      accounts.forEach(account => root.appendChild(accountCard(account)));
      const postHeading=document.createElement('div'); postHeading.className='panel'; postHeading.innerHTML='<strong>投稿・ハッシュタグ</strong>'; root.appendChild(postHeading);
      if ((result.hashtags || []).length) {
        const tags=document.createElement('div'); tags.className='panel hashtag-cloud';
        tags.innerHTML=(result.hashtags || []).map(t => '<button class="action" data-tag="#' + escapeHTML(t.tag) + '">#' + escapeHTML(t.tag) + '</button>').join('');
        tags.querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{ $('searchInput').value=b.dataset.tag; loadPage(); })); root.appendChild(tags);
      }
    }
    const items = result.posts || result.items || result.data || result.notifications || result.conversations || [];
    if (!Array.isArray(items) || items.length === 0) {
      if (page !== 'search') root.innerHTML='<div class="panel muted">まだ表示する内容がありません。</div>';
      else { const empty=document.createElement('div'); empty.className='panel muted'; empty.textContent='一致する投稿はありません。'; root.appendChild(empty); }
      return;
    }
    for (const item of items) {
      if (page === 'notifications') {
        const n=document.createElement('div'); n.className='post';
        const actor = item.actor || {};
        const who = actor.display_name || actor.user_id || 'ユーザー';
        const labels = {like:'いいねしました',repost:'リポストしました',reply:'コメントしました',follow:'フォローしました',follow_request:'フォロー申請しました',follow_accepted:'フォロー申請を承認しました',mention:'あなたに関連する投稿をしました'};
        n.textContent = who + ' さんが' + (labels[item.notification_type] || 'アクションしました') + ' · ' + new Date(item.created_at).toLocaleString();
        root.appendChild(n);
      } else if (item.content !== undefined || item.text !== undefined) root.appendChild(postCard(item));
      else {
        const card=document.createElement('div'); card.className='post'; card.textContent=item.title || item.conversation_type || '項目'; root.appendChild(card);
      }
    }
  }

  document.querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", () => {
      page = button.dataset.page;
      closeMobileMenu();
      if (page === "profile") viewedProfileId = null;
      document.querySelectorAll("[data-page]").forEach(item =>
        item.classList.toggle("active", item === button)
      );
      loadPage();
    });
  });

  $("searchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      page = "search";
      loadPage();
    }
  });

  $("logout").addEventListener("click", () => {
    closeMobileMenu();
    if (currentUser && sessionStorage.getItem("stax_token")) rememberAccount(currentUser, sessionStorage.getItem("stax_token"));
    sessionStorage.removeItem("stax_token");
    currentUser = null;
    $("app").classList.add("hidden");
    $("auth").classList.remove("hidden");
    $("password").value = "";
    status("ログアウトしました。");
  });

  async function restoreSession() {
    if (!configured || !client) {
      status("SupabaseのURLとPublishable Keyを設定してください。");
      return;
    }
    const token = sessionStorage.getItem("stax_token");
    if (!token) return;

    try {
      const result = await api("me");
      showApp(result.user || result);
    } catch {
      sessionStorage.removeItem("stax_token");
    }
  }

  restoreSession();
})();
</script>
</body>
</html>
